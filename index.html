<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0F0F14" />
    <title>Fransico — BBQ, Fast Food, Chinese &amp; Pizza</title>
    <meta
      name="description"
      content="Fransico - BBQ, Fast Food, Chinese & Pizza. Freshly grilled perfection, sizzled to order. Explore our huge variety of meals and exclusive budget deals."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B0B0E'/%3E%3Cpath d='M16 5c2.2 3.4.6 5.6-.9 7.4-1.6 1.9-3.4 3.9-3.4 6.6a4.3 4.3 0 0 0 8.6 0c0-1.5-.6-2.8-1.4-4 .3 1.6-.6 2.6-1.4 2.6-.9 0-1.4-.8-1-1.9.8-2.4.2-4.3-1.4-5.7-1-.9-1.5-2-.6-4.1-.7 1.5-.1 2.5.1 3.2.5 1.8 1.7 3.2 1.7 5.1 0 2.3-1.7 4-4.2 4z' fill='%23F59E0B'/%3E%3C/svg%3E"
    />
    <script>
      // Applied before paint to prevent a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('fransico-theme')
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
          var theme = stored || (prefersLight ? 'light' : 'dark')
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
